name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
      - name: Restore
        run: dotnet restore src/Casper.DataForge.CrossPlatform/Casper.DataForge.CrossPlatform.csproj
      - name: Build application
        run: dotnet build src/Casper.DataForge.CrossPlatform/Casper.DataForge.CrossPlatform.csproj -c Release --no-restore
      - name: Core smoke
        run: dotnet run --project tests/Casper.DataForge.Core.Smoke/Casper.DataForge.Core.Smoke.csproj -c Release
      - name: Engine client offline smoke
        run: dotnet run --project tests/Casper.EngineClient.Smoke/Casper.EngineClient.Smoke.csproj -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423
      - name: Restore
        run: dotnet restore src/Casper.DataForge.CrossPlatform/Casper.DataForge.CrossPlatform.csproj
      - name: Build application
        run: dotnet build src/Casper.DataForge.CrossPlatform/Casper.DataForge.CrossPlatform.csproj -c Release --no-restore
      - name: Core smoke
        run: dotnet run --project tests/Casper.DataForge.Core.Smoke/Casper.DataForge.Core.Smoke.csproj -c Release
      - name: Engine client offline smoke
        run: dotnet run --project tests/Casper.EngineClient.Smoke/Casper.EngineClient.Smoke.csproj -c Release
